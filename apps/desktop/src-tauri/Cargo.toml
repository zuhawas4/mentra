[package]
name = "mentra-desktop"
version = "0.1.0"
description = "Mentra desktop shell (Tauri + Rust)"
authors = ["Mentra"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "mentra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
